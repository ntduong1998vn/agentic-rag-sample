version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-rag
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: vectoradmin-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=vectoradmin
      - POSTGRES_USER=vectoradmin
      - POSTGRES_PASSWORD=vectoradmin123
    restart: unless-stopped

  vectoradmin:
    image: mintplexlabs/vectoradmin:latest
    container_name: vectoradmin
    ports:
      - "5000:3000"
    environment:
      - SERVER_PORT=3000
      - JWT_SECRET=${VECTORADMIN_JWT_SECRET:-supersecret}
      - DATABASE_CONNECTION_STRING=postgresql://vectoradmin:vectoradmin123@postgres:5432/vectoradmin
      - QDRANT_SERVER_URL=http://qdrant:6333
    depends_on:
      - qdrant
      - postgres
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
  postgres_data:
    driver: local
